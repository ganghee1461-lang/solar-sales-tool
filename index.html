<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>태양광 영업 GIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet">
<script defer src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css?v=20261119e">
</head>
<body>
<div id="app">
  <aside id="side">
    <button id="grip" type="button" aria-label="목록 접기"></button>
    <header>
      <h1>태양광 영업 GIS</h1>
    </header>

    <div id="filters">
      <div id="scope">
        <select id="sido" class="field" aria-label="광역"></select>
        <select id="sgg" class="field" aria-label="시군구"></select>
        <select id="emd" class="field" aria-label="읍면동"></select>
      </div>
      <div id="find">
        <input type="search" id="q" class="field" placeholder="검색" aria-label="검색" autocomplete="off">
        <ul id="hits" hidden></ul>
      </div>
    </div>

    <ol id="list"></ol>
  </aside>

  <main>
    <div id="map"></div>
    <div id="basemap" class="seg float" role="group" aria-label="배경">
      <button type="button" data-base="base" class="on">지도</button>
      <button type="button" data-base="sat">항공사진</button>
    </div>
    <div id="legend" class="float">
      <span><i class="c1"></i>후보</span>
      <span><i class="c2"></i>기존 태양광</span>
    </div>
    <button id="toggleSide" class="float" type="button">목록</button>
  </main>
</div>
<script defer src="app.js?v=20261119e"></script>
</body>
</html>
