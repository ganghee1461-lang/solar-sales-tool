<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>지붕 태양광 후보</title>
<link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="grip" aria-hidden="true"></div>
    <header>
      <div class="ttl">
        <h1>지붕 태양광 후보</h1>
        <select id="region" aria-label="지역"></select>
      </div>
      <div id="stats">
        <div><b id="sN">-</b><span>후보 회사</span></div>
        <div><b id="sCap">-</b><span>추정 용량 MW</span></div>
        <div><b id="sGen">-</b><span>연 발전량 GWh</span></div>
      </div>
    </header>

    <div id="filters">
      <div id="find">
        <input type="search" id="q" placeholder="회사명·주소·지역 검색" aria-label="검색" autocomplete="off">
        <ul id="hits" hidden></ul>
      </div>
      <div class="row2">
        <select id="emd" aria-label="읍면동"></select>
        <select id="solMode" aria-label="기존 태양광">
          <option value="exclude">기존 태양광 동 제외</option>
          <option value="all">전체 지붕 보기</option>
          <option value="only">기존 태양광 있는 회사</option>
        </select>
      </div>
      <details id="basis">
        <summary>조건 <span id="basisNow"></span></summary>
        <p>추정 용량 = 후보 지붕 면적 × 설치 가능 비율 × ㎡당 설비용량. 기존 태양광이 있는 동은 후보 지붕에서 뺍니다.</p>
        <label>최소 추정 용량 <b id="vMinC">100kW</b>
          <input type="range" id="minC" min="100" max="5000" step="100" value="100"></label>
        <label>설치 가능 비율 <b id="vUtil">50%</b>
          <input type="range" id="util" min="20" max="90" step="5" value="50"></label>
        <label>㎡당 설비용량 <b id="vKw">0.30kW</b>
          <input type="range" id="kw" min="5" max="35" step="1" value="30"></label>
      </details>
    </div>

    <ol id="list"></ol>
  </aside>

  <main>
    <div id="map"></div>
    <div id="basemap" role="group" aria-label="배경">
      <button data-base="base" class="on">지도</button>
      <button data-base="sat">항공사진</button>
    </div>
    <div id="legend">
      <span><i class="c1"></i>후보</span>
      <span><i class="c2"></i>기존 태양광(판매용 등록)</span>
    </div>
    <button id="toggleSide">목록</button>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
