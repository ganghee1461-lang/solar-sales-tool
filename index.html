<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>지붕 태양광 후보</title>
<link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet">
<script defer src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css?v=20261118g">
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="grip" aria-hidden="true"></div>
    <header>
      <div class="ttl">
        <h1>지붕 태양광 후보</h1>
      </div>
    </header>

    <div id="filters">
      <div id="scope">
        <select id="sido" aria-label="광역"></select>
        <select id="sgg" aria-label="시군구"></select>
        <select id="emd" aria-label="읍면동"></select>
      </div>
      <div id="find">
        <input type="search" id="q" placeholder="검색" aria-label="검색" autocomplete="off">
        <ul id="hits" hidden></ul>
      </div>
      <div class="row1">
        <select id="solMode" aria-label="기존 태양광">
          <option value="all">전체</option>
          <option value="exclude" selected>기존 태양광 제외</option>
        </select>
      </div>
      <details id="basis">
        <summary>조건 <span id="basisNow"></span></summary>
        <label>최소 추정 용량 <b id="vMinC">100kW</b>
          <input type="range" id="minC" min="100" max="5000" step="100" value="100"></label>
        <label>설치 가능 비율 <b id="vUtil">50%</b>
          <input type="range" id="util" min="20" max="90" step="5" value="50"></label>
        <label>㎡당 설비용량 <b id="vKw">0.30kW</b>
          <input type="range" id="kw" min="5" max="35" step="1" value="30"></label>
      </details>
    </div>

    <ol id="list"></ol>
  </aside>

  <main>
    <div id="map"></div>
    <div id="basemap" role="group" aria-label="배경">
      <button data-base="base" class="on">지도</button>
      <button data-base="sat">항공사진</button>
    </div>
    <div id="legend">
      <span><i class="c1"></i>후보</span>
      <span><i class="c2"></i>기존 태양광</span>
    </div>
    <button id="toggleSide">목록</button>
  </main>
</div>
<script defer src="app.js?v=20261118g"></script>
</body>
</html>
